<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Basketbold</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Basketbold">
<meta name="theme-color" content="#1b2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --navy:#1b2a4a; --navy2:#24365e; --orange:#ff7a1a; --orange2:#ffa14d; --cream:#fff8ef;
  --ink:#1b2a4a; --ink2:#51607c; --muted:#8a94a8; --line:#e4e0d6;
  --green:#2aa86b; --red:#e04f4f; --yellow:#ffc632; --card:#ffffff;
  --r:22px; --shadow:0 6px 20px rgba(27,42,74,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;font-size:18px;line-height:1.35}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
input,select,textarea{font:inherit}
h1,h2,h3{margin:0;line-height:1.15}
.app{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 12px;
  display:flex;align-items:center;gap:12px;border-bottom-left-radius:26px;border-bottom-right-radius:26px}
header.top .hello{flex:1;min-width:0}
header.top .hello small{opacity:.75;font-size:14px;display:block}
header.top .hello b{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chip{background:rgba(255,255,255,.14);border-radius:999px;padding:8px 14px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.points{background:var(--orange);color:#fff}
.chip.rain{font-size:20px;padding:6px 12px}
.chip.rain.on{background:#5aa9ff;color:#fff}
main{flex:1;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.screen{display:none;animation:fade .25s}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;position:relative}
button.card{width:100%;display:block;text-align:center}
.card.main{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px}
.card.main .label{color:var(--orange2)}
.card.done{opacity:.92}
.label{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.drillrow{display:flex;align-items:center;gap:14px}
.drillrow .em{font-size:44px;line-height:1;width:60px;text-align:center;flex:none}
.drillrow .nm{flex:1;min-width:0}
.drillrow .nm h2{font-size:24px}
.drillrow .nm .sub{font-size:15px;opacity:.8;margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--orange);color:#fff;font-weight:800;border-radius:16px;
  padding:14px 22px;font-size:19px;box-shadow:0 4px 0 #cf5e08;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #cf5e08}
.btn.big{width:100%;padding:18px;font-size:22px;margin-top:14px}
.btn.ghost{background:transparent;color:var(--ink2);box-shadow:none;border:2px solid var(--line)}
.btn.ghost:active{transform:none}
.btn.green{background:var(--green);box-shadow:0 4px 0 #1d7d4e}
.btn.red{background:var(--red);box-shadow:0 4px 0 #a83434}
.btn.navy{background:var(--navy);box-shadow:0 4px 0 #0e1730}
.btn.sm{padding:10px 16px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.done-badge{position:absolute;top:14px;right:16px;background:var(--green);color:#fff;font-weight:800;border-radius:999px;padding:6px 12px;font-size:14px}
.lvl{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.lvl i{width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.15);display:block}
.card.main .lvl i{background:rgba(255,255,255,.25)}
.lvl i.on{background:var(--yellow)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.prizebar{height:14px;border-radius:999px;background:#eee7da;overflow:hidden;margin-top:8px}
.prizebar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));border-radius:999px;transition:width .6s}
.muted{color:var(--muted);font-size:15px}
.ink2{color:var(--ink2)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:6px 8px calc(8px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0;border-radius:14px}
nav.tabs button span{font-size:26px;line-height:1}
nav.tabs button.on{color:var(--orange);background:#fff3e6}
/* drill screen */
.media{max-width:300px;margin:4px auto 10px}
.anim{width:100%;height:auto;display:block;background:#fbf7f0;border-radius:16px}
.drill-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.drill-head .em{font-size:48px}
.drill-head h2{font-size:26px}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:17px}
.steps li:last-child{border:0}
.steps li b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.tip{background:#fff3e6;border-left:5px solid var(--orange);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:16px}
.eq{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.eq span{background:#f1efe8;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--ink2)}
.control{text-align:center;padding:10px 0 0}
.bignum{font-size:96px;font-weight:900;line-height:1;letter-spacing:-.03em;color:var(--navy);font-variant-numeric:tabular-nums}
.bignum.warn{color:var(--red)}
.target{font-size:18px;color:var(--ink2);margin-top:4px;font-weight:700}
.tapzone{margin-top:14px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;border-radius:28px;padding:34px 10px;font-size:40px;font-weight:900;
  box-shadow:0 6px 0 #cf5e08;width:100%;transition:transform .06s}
.tapzone:active{transform:scale(.97) translateY(4px);box-shadow:0 2px 0 #cf5e08}
.tapzone small{display:block;font-size:16px;font-weight:700;opacity:.9}
.tapzone.score{background:linear-gradient(135deg,var(--green),#4cc98a);box-shadow:0 6px 0 #1d7d4e;font-size:30px}
.tapzone.score:active{box-shadow:0 2px 0 #1d7d4e}
.days{display:flex;gap:4px;align-items:flex-end;justify-content:space-between}
.day{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.day i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:#eee7da}
.day.some i{background:var(--orange2)} .day.full i{background:var(--green)}
.day b{font-size:11px;color:var(--ink2);height:12px} .day small{font-size:9px;color:var(--muted);line-height:1.1}
.list li.got{opacity:.55}
.sel button small{font-weight:600;font-size:11px;opacity:.8}
.checklist{list-style:none;padding:0;margin:0 0 4px;display:flex;flex-direction:column;gap:6px;text-align:left}
.checklist li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:#f7f4ec;color:var(--muted);font-size:17px}
.checklist li.now{background:#fff3e6;color:var(--ink);font-weight:700;outline:2px solid var(--orange)}
.checklist li.done{color:var(--green);text-decoration:line-through}
.checklist .box{width:28px;height:28px;border-radius:50%;background:#e4e0d6;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none}
.checklist li.now .box{background:var(--orange);color:#fff} .checklist li.done .box{background:var(--green);color:#fff}
.makes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.makes button{border-radius:24px;padding:28px 10px;font-size:26px;font-weight:900;color:#fff}
.makes .hit{background:var(--green);box-shadow:0 6px 0 #1d7d4e}
.makes .miss{background:var(--red);box-shadow:0 6px 0 #a83434}
.makes button:active{transform:translateY(4px);box-shadow:none}
.ctrlrow{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.ring{width:170px;height:170px;margin:0 auto}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:#eee7da}
.ring .fg{stroke:var(--orange);transition:stroke-dashoffset 1s linear}
.countdown{position:fixed;inset:0;background:rgba(27,42,74,.92);color:#fff;display:none;align-items:center;justify-content:center;z-index:50;font-size:160px;font-weight:900}
.countdown.show{display:flex}
/* result */
.result{text-align:center;padding:10px 0}
.result .em{font-size:84px}
.result h2{font-size:32px;margin-top:6px}
.result .pts{display:inline-block;background:var(--orange);color:#fff;border-radius:999px;padding:10px 22px;font-size:26px;font-weight:900;margin-top:12px}
.result .detail{margin-top:14px;color:var(--ink2);font-size:17px}
.result .record{background:#fff3e6;color:var(--orange);font-weight:900;border-radius:14px;padding:10px;margin-top:10px;font-size:20px}
/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border:0}
.list .em{font-size:30px;width:40px;text-align:center;flex:none}
.list .nm{flex:1;min-width:0}
.list .nm b{display:block}
.list .nm small{color:var(--muted)}
.list li.locked{opacity:.45}
.tiers h3{font-size:16px;margin:16px 0 4px;color:var(--ink2)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.badge{background:#fff;border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.badge .em{font-size:34px}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge small{display:block;font-size:11px;color:var(--muted)}
.badge.locked{opacity:.35;filter:grayscale(1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:28px;color:var(--navy)}
.stat small{color:var(--muted);font-size:12px}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px}
.chart .ln{fill:none;stroke:var(--orange);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:#fff;stroke:var(--orange);stroke-width:2}
.chart .pt.best{fill:var(--orange)}
.chart .val{fill:var(--ink2);font-size:12px;font-weight:700}
/* forms */
.field{margin:10px 0}
.field label{display:block;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.field input[type=text],.field input[type=number],.field input[type=password],.field select,.field textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:17px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
.toggle:last-child{border:0}
.switch{width:54px;height:32px;border-radius:999px;background:#d9d4c8;position:relative;transition:.2s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch.on{background:var(--green)}
.switch.on i{left:25px}
.modal{position:fixed;inset:0;background:rgba(27,42,74,.6);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:12px}
.modal.show{display:flex}
.modal .sheet{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:560px;max-height:85vh;overflow:auto}
.modal h3{font-size:22px;margin-bottom:10px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pinpad button{background:#f1efe8;border-radius:16px;padding:18px;font-size:26px;font-weight:800}
.pindots{text-align:center;font-size:34px;letter-spacing:10px;height:46px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;z-index:60;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:45}
.center{text-align:center}
.mt{margin-top:12px}
.flex{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.small{font-size:14px}
.hr{height:1px;background:var(--line);margin:14px 0}
.sel{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sel button{background:#f1efe8;border-radius:999px;padding:8px 14px;font-weight:700;color:var(--ink2)}
.sel button.on{background:var(--navy);color:#fff}
.streakflame{font-size:15px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:12px 0}
.vs .who{background:#f1efe8;border-radius:16px;padding:12px}
.vs .who b{display:block;font-size:30px}
.vs .who.win{background:#e4f7ec;outline:3px solid var(--green)}
</style>
<style id="animstyles"></style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="hello"><small id="hello-sub">Klar til træning?</small><b id="hello-name">Hej!</b></div>
  <button class="chip rain" id="rainbtn" title="Regnvejr – vis kun indendørs øvelser">☔</button>
  <div class="chip" id="streakchip">🔥 0</div>
  <div class="chip points" id="pointschip">⭐ 0</div>
</header>
<main>
  <section class="screen active" id="s-home"></section>
  <section class="screen" id="s-drill"></section>
  <section class="screen" id="s-progress"></section>
  <section class="screen" id="s-prizes"></section>
  <section class="screen" id="s-more"></section>
</main>
<nav class="tabs">
  <button data-tab="home" class="on"><span>🏠</span>I dag</button>
  <button data-tab="progress"><span>📈</span>Udvikling</button>
  <button data-tab="prizes"><span>🎁</span>Præmier</button>
  <button data-tab="more"><span>⚙️</span>Mere</button>
</nav>
</div>
<div class="countdown" id="countdown">3</div>
<div class="modal" id="modal"><div class="sheet" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<canvas class="confetti" id="confetti"></canvas>
<script>
// ===== ØVELSESBIBLIOTEK (v2) =====
// level: 1-4. Niveauer låses op manuelt af en voksen i Forældre-menuen.
// type 'count': tæl op til målet, trin for trin (steps). score:true = tælleren er scoringer ("I kurven").
// type 'time':  hold den kørende i X sekunder (count:true = tæl samtidig hvor mange)
// lookUp:true = øvelsen viser påmindelsen "Kig op – ikke på bolden"
const LOOKUP = 'Kig op – ikke på bolden.';
const LINE = 'Stil dig ved stregen: tæerne rører stregen.';
const DRILLS = [
  // ---------- NIVEAU 1 ----------
  { id:'drib', level:1, cat:'Håndtering', emoji:'🏀', name:'Dribling', anim:'dribble_r', indoor:true, eq:[], type:'count', lookUp:true,
    steps:[{label:'Højre hånd',n:50},{label:'Venstre hånd',n:50}],
    how:[LINE,'Drible, så bolden rammer stregen hver gang.','50 med højre hånd og 50 med venstre.'], tip:'Bøj knæene og brug fingerspidserne.' },
  { id:'lav', level:1, cat:'Håndtering', emoji:'⬇️', name:'Lav dribling', anim:'low', indoor:true, eq:[], type:'count', lookUp:true,
    steps:[{label:'Højre hånd',n:50},{label:'Venstre hånd',n:50}],
    how:[LINE,'Gå ned i knæ. Drible lavt og hurtigt – under knæene – så bolden rammer stregen.','50 med hver hånd.'], tip:'Små, hurtige tryk med fingrene.' },
  { id:'haard', level:1, cat:'Håndtering', emoji:'💥', name:'Hård dribling', anim:'pound', indoor:false, eq:[], type:'count', lookUp:true,
    steps:[{label:'Højre hånd',n:50},{label:'Venstre hånd',n:50}],
    how:[LINE,'Slå bolden hårdt i jorden på stregen, så den kommer hurtigt op igen.','50 med hver hånd.'], tip:'Tænk: bolden er en hammer.' },
  { id:'finger', level:1, cat:'Håndtering', emoji:'👆', name:'Fingerspids-tap', anim:'fingertip', indoor:true, eq:[], type:'count',
    steps:[{label:'Over hovedet',n:30},{label:'Ved brystet',n:30},{label:'Ved knæene',n:30}],
    how:['Strakte arme.','Tap bolden hurtigt fra hånd til hånd med fingerspidserne.','30 over hovedet, 30 ved brystet og 30 ved knæene.'], tip:'Kun fingrene rører bolden.' },
  { id:'livet', level:1, cat:'Håndtering', emoji:'🔄', name:'Bold rundt om livet', anim:'around_waist', indoor:true, eq:[], type:'count', lookUp:true,
    steps:[{label:'Højre om',n:10},{label:'Venstre om',n:10}],
    how:['Før bolden rundt om livet fra hånd til hånd.','10 gange den ene vej og 10 gange den anden vej.'], tip:'Hurtigere og hurtigere – uden at tabe den.' },
  { id:'benene', level:1, cat:'Håndtering', emoji:'🦵', name:'Bold rundt om benene', anim:'around_legs', indoor:true, eq:[], type:'count', lookUp:true,
    steps:[{label:'Højre om',n:10},{label:'Venstre om',n:10}],
    how:['Saml benene og bøj knæene.','Før bolden rundt om benene.','10 gange hver vej.'], tip:'Hold bolden lavt.' },
  { id:'hovedet', level:1, cat:'Håndtering', emoji:'🙆', name:'Bold rundt om hovedet', anim:'around_head', indoor:true, eq:[], type:'count',
    steps:[{label:'Højre om',n:10},{label:'Venstre om',n:10}],
    how:['Før bolden rundt om hovedet fra hånd til hånd.','10 gange hver vej.'], tip:'Rolige hænder – bolden må ikke ramme hovedet.' },
  { id:'hopstop', level:1, cat:'Kurv', emoji:'⏹️', name:'Hop-stop', anim:'jumpstop', indoor:false, eq:['kurv'], type:'count', score:true,
    steps:[{label:'Højre hånd',n:10},{label:'Venstre hånd',n:10}],
    how:['Drible mod kurven.','Stop med et hop – begge fødder lander samtidig.','Skyd. Scor 10 med højre hånd og 10 med venstre.'], tip:'Land med bøjede knæ – så er du klar til at skyde.' },
  { id:'flot', level:1, cat:'Kurv', emoji:'✨', name:'Flotteste skud', anim:'shot', indoor:false, eq:['kurv'], type:'count', score:true,
    steps:[{label:'Swish',n:10}],
    how:['Stå tæt på kurven.','Skyd så flot du kan: albuen under bolden, svip med håndleddet.','Scor 10 swish – bolden går i uden at røre ringen.'], tip:'Fingrene peger ned i kurven, når bolden er fløjet.' },
  { id:'layup', level:1, cat:'Kurv', emoji:'🏃', name:'Lay-up', anim:'layup', indoor:false, eq:['kurv'], type:'count', score:true,
    steps:[{label:'Fra højre',n:10},{label:'Fra venstre',n:10}],
    how:['Lav 10 lay-ups fra højre side.','Lav 10 lay-ups fra venstre side.','Bolden skal i kurven for at tælle.'], tip:'Læg bolden blødt op på pladen.' },
  { id:'plade', level:1, cat:'Kurv', emoji:'🟥', name:'Pladeskud fra siden', anim:'shot', indoor:false, eq:['kurv'], type:'count', score:true,
    steps:[{label:'Fra højre side',n:10},{label:'Fra venstre side',n:10}],
    how:['Stå skråt ved siden af kurven.','Skyd bolden på pladen, så den rammer det øverste hjørne af firkanten.','Scor 10 fra hver side.'], tip:'Pladen er din ven.' },

  // ---------- NIVEAU 2 ----------
  { id:'crossover', level:2, cat:'Håndtering', emoji:'↔️', name:'Crossover', anim:'crossover', indoor:true, eq:[], type:'count', lookUp:true,
    steps:[{label:'Crossovers',n:20}],
    how:['Drible bolden foran dig fra højre hånd til venstre – og tilbage.','Hold bolden lavt, når den krydser.'], tip:'Stå bredt.' },

let VOICE=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); VOICE = vs.find(v=>/^da/i.test(v.lang) && /premium|enhanced|forbedret/i.test(v.name)) || vs.find(v=>/^da/i.test(v.lang)) || null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, opts={}){
  if(!S.settings.voice || !('speechSynthesis' in window)) return;
  try{
    if(!opts.queue) speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='da-DK'; if(VOICE) u.voice=VOICE; u.rate=opts.rate||0.95; u.pitch=1.05; u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function shutUp(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }
function speakDrill(d, kind){
  const intro = kind==='bench' ? 'Testdag. ' : kind==='duel' ? 'Duel! ' : '';
  speak(`${intro}${d.name}. ${d.how.join(' ')} ${d.lookUp?LOOKUP+' ':''}Husk: ${d.tip}`);
}

}

function load(){

function migrate(s){
  const d = defaultState();
  s.settings = Object.assign(d.settings, s.settings||{}); s.settings.eq = Object.assign(d.settings.eq, s.settings.eq||{});
  // v2 -> v3: trin 1-4 erstattes af én samlet stige. Alt, der var låst op, forbliver låst op.
  if(s.unlocked===undefined){
    const lvl=s.level||1; const doneIds=new Set((s.log||[]).filter(l=>l.done).map(l=>l.drill));
    let maxIdx=PROG.filter(x=>x.level<=lvl).length-1; PROG.forEach((d,i)=>{ if(doneIds.has(d.id)) maxIdx=Math.max(maxIdx,i); });
    s.unlocked=Math.max(1, maxIdx+1); s.plan=null;
  }
  for(const k of Object.keys(d)) if(s[k]===undefined) s[k]=d[k];
  if(!Array.isArray(s.prizes)||!s.prizes.length) s.prizes=defaultPrizes();
  return s;
}

const pad = n => String(n).padStart(2,'0');
function dstr(d=new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(ds, n){ const [y,m,d]=ds.split('-').map(Number); return dstr(new Date(y,m-1,d+n)); }
function today(){ return dstr(); }
function isSunday(ds=today()){ const [y,m,d]=ds.split('-').map(Number); return new Date(y,m-1,d).getDay()===0; }
function isoWeek(ds){ const [y,m,d]=ds.split('-').map(Number); const t=new Date(Date.UTC(y,m-1,d)); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return t.getUTCFullYear()+'-W'+pad(Math.ceil(((t-y0)/864e5+1)/7)); }
function fmtDate(ds){ const [y,m,d]=ds.split('-'); return `${Number(d)}/${Number(m)}`; }
const DAGE=['søn','man','tir','ons','tor','fre','lør'];
function dayName(ds){ const [y,m,d]=ds.split('-').map(Number); return DAGE[new Date(y,m-1,d).getDay()]; }

// ===== ØVELSER =====
const byId = Object.fromEntries(DRILLS.map(d=>[d.id,d]));
const benchById = Object.fromEntries(BENCHMARKS.map(b=>[b.id,b]));
function hasEq(d){ return (d.eq||[]).every(e=>S.settings.eq[e]); }
function pool(){ return PROG.filter(hasEq); }                     // hele stigen med det udstyr, I har
function unlockedDrills(){ return pool().slice(0, S.unlocked); }
function nextNewDrill(){ return pool()[S.unlocked] || null; }
function lastDone(id){ let last=null; for(const l of S.log) if(l.drill===id && l.done && (!last||l.date>last)) last=l.date; return last; }
function seeded(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return ()=>{ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return ((h^=h>>>16)>>>0)/4294967296; }; }
// Dagens plan: én NY øvelse (næste på stigen) + de øvelser, der er længst siden han har lavet – med en blanding af bold og kurv.
function ensurePlan(){
  const t=today();
  if(S.plan && S.plan.date===t) return S.plan;
  const rng=seeded(t+'plan'); const daily=S.daily||10;
  const doneTodayIds=[...new Set(S.log.filter(l=>l.date===t&&l.kind==='level'&&l.done).map(l=>l.drill))];
  const newD=nextNewDrill();
  const ids=[...doneTodayIds]; if(newD && !ids.includes(newD.id)) ids.push(newD.id);
  const cands=unlockedDrills().filter(d=>!ids.includes(d.id));
  const key=d=>(lastDone(d.id)||'0000')+rng().toFixed(6);               // ældst først, tilfældig rækkefølge blandt lige gamle
  const hand=cands.filter(d=>!d.score).sort((a,b)=>key(a)<key(b)?-1:1), hoop=cands.filter(d=>d.score).sort((a,b)=>key(a)<key(b)?-1:1);
  const need=Math.max(0,daily-ids.length); const hoopShare=cands.length?hoop.length/cands.length:0; let nHoop=Math.round(need*hoopShare), nHand=need-nHoop;
  if(nHoop>hoop.length){ nHand+=nHoop-hoop.length; nHoop=hoop.length; } if(nHand>hand.length){ nHoop=Math.min(hoop.length,nHoop+nHand-hand.length); nHand=hand.length; }
  const pick=[...hand.slice(0,nHand),...hoop.slice(0,nHoop)];
  pick.sort((a,b)=>(a.score?1:0)-(b.score?1:0) || PROG.indexOf(a)-PROG.indexOf(b));   // bold først, kurv bagefter
  for(const d of pick) ids.push(d.id);
  S.plan={date:t, drills:ids, newId:newD?newD.id:null}; save(); return S.plan;
}
function levelDrills(){ return ensurePlan().drills.map(id=>byId[id]).filter(d=>d&&hasEq(d)); }
function pointsPer(){ const n=levelDrills().length||1; const per=Math.floor(DAILY_MAX/n); return {per, bonus:DAILY_MAX-per*n, n}; }
function goalText(d){ if(d.type==='time') return `${d.seconds} sekunder`; return d.steps.map(s=>`${s.n} ${s.label.toLowerCase()}`).join(' · '); }
function totalGoal(d){ return d.steps.reduce((a,s)=>a+s.n,0); }
function doneToday(id, date=today()){ return S.log.some(l=>l.date===date && l.drill===id && l.kind==='level' && l.done); }
function dayPoints(date=today()){ return S.log.filter(l=>l.date===date).reduce((a,l)=>a+(l.points||0),0); }
function fullDays(s){ return new Set(s.log.filter(l=>l.kind==='level' && l.full).map(l=>l.date)).size; }
function totalScores(s){ return s.log.filter(l=>l.score).reduce((a,l)=>a+(l.result||0),0); }
function benchDays(s){ return new Set(s.log.filter(l=>l.kind==='bench').map(l=>l.date)).size; }
function suggested(){ // "Start her": den nye øvelse først, ellers næste på listen
  const P=ensurePlan(); const ds=levelDrills().filter(d=>!S.settings.rain||d.indoor); const left=ds.filter(d=>!doneToday(d.id)); if(!left.length) return null;
  return left.find(d=>d.id===P.newId) || left[0];
}
function isNewToday(id){ return ensurePlan().newId===id; }

function registerStreakDay(){

  else st.current=1;

}

function beep(freq=880, dur=0.12, type='sine', vol=0.25){ if(!S.settings.sound) return; const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=vol; o.connect(g); g.connect(c.destination); const t=c.currentTime; o.start(t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.stop(t+dur+0.02); }

function confetti(n=140){
  const cv=$('#confetti'), ctx=cv.getContext('2d'); cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; ctx.scale(devicePixelRatio,devicePixelRatio);
  const cols=['#ff7a1a','#ffc632','#2aa86b','#5aa9ff','#e04f4f','#ffffff'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*0.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*7+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0; (function step(){ ctx.clearRect(0,0,innerWidth,innerHeight); f++;
    for(const p of ps){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.vx*=0.99; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); ctx.restore(); }
    if(f<140) requestAnimationFrame(step); else ctx.clearRect(0,0,innerWidth,innerHeight); })();
}

function stepLabel(){ const a=active, d=a.d; const st=d.steps[a.step]; const multi=d.steps.length>1;
  $('#steplabel').innerHTML = multi ? `Trin ${a.step+1} af ${d.steps.length}: <span style="color:var(--orange)">${esc(st.label)}</span>` : (st.label? esc(st.label):'Tæl op'); }
function renderControl(){

function ringHTML(secs){ return `<svg class="ring" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ringfg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>
  <text id="ringtxt" x="60" y="60" text-anchor="middle" dominant-baseline="central" font-size="40" font-weight="900" fill="#1b2a4a">${secs}</text></svg>`; }
function countdownThen(fn){
  const cd=$('#countdown'); let n=3; cd.textContent=n; cd.classList.add('show'); beep(660,0.15); speak('Klar? Tre',{rate:1.1});
  const iv=setInterval(()=>{ n--; if(n>0){ cd.textContent=n; beep(660,0.15); speak(['','en','to'][n],{rate:1.1}); } else { clearInterval(iv); cd.textContent='GO!'; beep(1320,0.4); speak('Kør!',{rate:1.1}); setTimeout(()=>{cd.classList.remove('show'); fn();},400);} },1000);
}
function runTimer(secs, onEnd){
  const a=active; if(!a) return; const start=Date.now(); const ctrl=$('#ctrl');
  ctrl.innerHTML=`<button class="tapzone score" id="tap">I kurven ✅ +1</button>`; $('#tap').addEventListener('click',()=>{ a.count++; $('#num').textContent=a.count; beep(1047,0.08); });
  const fg=$('#ringfg'), tx=$('#ringtxt'); const C=326.7;
  a.timer=setInterval(()=>{ const e=(Date.now()-start)/1000; const left=Math.max(0,secs-e); tx.textContent=Math.ceil(left); fg.style.strokeDashoffset=C*(1-left/secs);
    const il=Math.ceil(left); if(il!==a.lastBeep && il<=3 && il>0){ a.lastBeep=il; beep(880,0.1); speak(['','en','to','tre'][il],{rate:1.1}); }
    else if(il!==a.lastBeep && il===Math.round(secs/2) && secs>=20){ a.lastBeep=il; speak('Halvvejs!'); }
    if(left<=0){ clearInterval(a.timer); a.timer=null; beep(1320,0.5); speak('Stop!'); onEnd(); } },100);
}
function finish(){
  const a=active; if(!a) return; stopActive(); active=null; const d=a.d;
  const result = d.type==='time' ? a.count : a.counts.reduce((x,y)=>x+y,0);
  if(a.kind==='duel') return duelResult(a, result);
  const t=today(); const P=ensurePlan(); let kind=a.kind; if(kind==='level' && (!P.drills.includes(d.id) || doneToday(d.id))) kind='extra';
  let learned=false; if(kind==='level' && P.newId===d.id){ S.unlocked=Math.min(pool().length, S.unlocked+1); P.newId=null; learned=true; }
  const entry={date:t,time:Date.now(),drill:d.id,kind,result,done:true,points:0,score:!!d.score};
  const r={pts:0, msgs:[]};
  if(kind==='level'){
    const {per,bonus,n}=pointsPer(); entry.points=per;
    const doneN=levelDrills().filter(x=>doneToday(x.id)).length+1;
    if(doneN>=n){ entry.points+=bonus; entry.full=true; r.full=true; }
    r.streakMsg=registerStreakDay();
  }
  S.log.push(entry); S.points+=entry.points; r.pts=entry.points; r.learned=learned;
  r.newBadges=checkBadges(); save();
  renderResult(d, result, r, kind);
}

  for(const b of (r.newBadges||[])) msgs.push(`<div class="record">${b.emoji} Nyt mærke: ${esc(b.name)}</div>`);

    <div class="ink2 mt">${esc(d.name)} · ${d.type==='time'?result+' scoringer':'klaret'}</div>

    const upd=()=>{ $('#num').textContent=a.count; c.querySelector('.target').textContent=`i kurven · ${a.count+a.miss} af ${b.attempts} skud`; if(a.count+a.miss>=b.attempts) setTimeout(()=>finishBench(a.count),350); };
    $('#hit').addEventListener('click',()=>{ a.count++; a.last='h'; beep(1047,0.1); upd(); });

  } else {

    $('#tap').addEventListener('click',()=>{ a.count++; $('#num').textContent=a.count; beep(700,0.05,'sine',0.12); if(a.count%10===0) speak(String(a.count),{rate:1.2}); });
    $('#minus').addEventListener('click',()=>{ if(a.count>0){a.count--; $('#num').textContent=a.count;} });
    $('#drop').addEventListener('click',()=>finishBench(a.count));

function finishBench(result){
  const a=active; stopActive(); active=null; const b=a.d; const t=today();
  if(a.kind==='duel') return duelResult(a,result,b);
  const prev=S.records[b.id]; const newRecord = prev!==undefined && result>prev; const first=prev===undefined;
  if(first||result>prev) S.records[b.id]=result;
  S.log.push({date:t,time:Date.now(),drill:b.id,kind:'bench',result,points:0,score:b.type==='makesof'});
  const nb=checkBadges(); save();
  const s=$('#s-drill'); if(newRecord){ fanfare(); confetti(220);} else beep(880,0.2);
  const allDone=BENCHMARKS.filter(hasEq).every(x=>S.log.some(l=>l.date===t&&l.kind==='bench'&&l.drill===x.id));

    <div class="detail">${first?'Første måling – næste søndag kan du slå den!':newRecord?`Sidste rekord var ${prev}.`:`Din rekord er ${prev}. Du nåede ${result} – det kommer!`}</div>
    ${nb.map(x=>`<div class="record">${x.emoji} Nyt mærke: ${esc(x.name)}</div>`).join('')}${allDone?'<div class="record">🏆 Alle tests klaret! Se din udvikling under 📈</div>':''}
  </div></div><button class="btn big navy" id="btn-back">Tilbage til i dag</button>`;
  setTimeout(()=>speak(newRecord?`Ny rekord! ${result}!`:`Du fik ${result}.`),300);
  $('#btn-back').addEventListener('click',()=>show('home')); header();
}

// ===== UDVIKLING =====
function chartSVG(points, opts){
  const W=600,H=220,pl=36,pr=16,pt=28,pb=30; if(points.length<2) return `<p class="muted">Lav testen to søndage, så kommer der en graf her.</p>`;
  const vals=points.map(p=>p.value); const max=Math.max(...vals, opts.max||0)*1.15||1; const best=Math.max(...vals);
  const x=i=>pl+(W-pl-pr)*(i/(points.length-1)); const y=v=>pt+(H-pt-pb)*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">`;
  for(const f of [0,0.5,1]){ const t=Math.round(max*f); s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`; }
  s+=`<path class="ln" d="${points.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.value).toFixed(1)).join(' ')}"/>`;
  points.forEach((p,i)=>{ const isBest=p.value===best; s+=`<circle class="pt ${isBest?'best':''}" cx="${x(i)}" cy="${y(p.value)}" r="5"><title>${fmtDate(p.date)}: ${p.value}</title></circle>`;
    if(isBest||i===points.length-1||i===0) s+=`<text class="val" x="${x(i)}" y="${y(p.value)-10}" text-anchor="middle">${p.value}</text>`;
    if(points.length<=8 || i%Math.ceil(points.length/8)===0 || i===points.length-1) s+=`<text class="axis" x="${x(i)}" y="${H-10}" text-anchor="middle">${fmtDate(p.date)}</text>`; });
  return s+'</svg>';
}

    <div class="stats mt"><div class="stat"><b>🔥 ${S.streak.best}</b><small>længste streak</small></div><div class="stat"><b>${S.points}</b><small>point i alt</small></div><div class="stat"><b>${S.badges.length}/${BADGES.length}</b><small>mærker</small></div></div>`;

  h+=`<h2 style="font-size:22px;margin:18px 0 8px">📈 Testdag-udvikling</h2>`;
  for(const b of BENCHMARKS){ const pts=S.log.filter(l=>l.kind==='bench'&&l.drill===b.id).map(l=>({date:l.date,value:l.result})).sort((p,q)=>p.date<q.date?-1:1); const best=S.records[b.id];
    h+=`<div class="card"><div class="flex"><span style="font-size:28px">${b.emoji}</span><div class="grow"><b>${esc(b.label)}</b><div class="muted">${pts.length?`${pts.length} test${pts.length>1?'s':''} · bedste: ${best}`:'Ikke testet endnu – første test på søndag'}</div></div></div>${chartSVG(pts,{label:b.label,max:b.attempts||0})}</div>`; }
  const pl=pool(); const times=id=>S.log.filter(l=>l.drill===id&&l.done).length;
  h+=`<h2 style="font-size:22px;margin:18px 0 8px">🪜 Øvelsesstigen</h2><div class="card"><p class="muted small" style="margin:0 0 8px">${S.unlocked} af ${pl.length} øvelser lært. Hver træningsdag lærer du én ny.</p><ul class="list">`
    +pl.map((d,i)=>{ const st=i<S.unlocked?'open':i===S.unlocked?'next':'locked'; return `<li class="${st==='locked'?'locked':''}"><div class="em">${st==='open'?d.emoji:st==='next'?'🆕':'🔒'}</div><div class="nm"><b>${i+1}. ${esc(d.name)}</b><small>${esc(goalText(d))}${st==='next'?' · næste nye øvelse':''}</small></div><span class="muted small">${times(d.id)?times(d.id)+'×':''}</span></li>`; }).join('')+'</ul></div>';
  h+=`<h2 style="font-size:22px;margin:18px 0 8px">🏅 Mærker</h2><div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges.includes(b.id)?'':'locked'}"><div class="em">${b.emoji}</div><b>${esc(b.name)}</b><small>${esc(b.desc)}</small></div>`).join('')}</div>`;
  $('#s-progress').innerHTML=h;
}

// ===== PRÆMIER =====
function renderPrizes(){
  header();
  const ps=[...S.prizes].sort((a,b)=>a.cost-b.cost);
  let h=`<div class="card main"><div class="label">Point i alt</div><h2 style="font-size:40px">⭐ ${S.points}</h2><div style="opacity:.8;margin-top:4px">Hver gang du når en ny streg på stigen, kan du hente præmien.</div></div><div class="card"><ul class="list">`;
  for(const p of ps){ const can=S.points>=p.cost && !p.redeemedAt; const got=!!p.redeemedAt; const next=!got&&!can&&p===ps.find(x=>!x.redeemedAt&&S.points<x.cost);
    h+=`<li class="${got?'got':''}" style="${next?'background:#fff3e6;border-radius:12px;padding:12px 8px':''}"><div class="em">${p.emoji}</div><div class="nm"><b>${esc(p.name)}</b><small>${p.cost} point${got?' · hentet '+fmtDate(p.redeemedAt):next?' · mangler '+(p.cost-S.points):''}</small></div>
      ${can?`<button class="btn green sm" data-redeem="${p.id}">Hent 🎁</button>`:got?'<span style="color:var(--green);font-weight:800">✓</span>':`<span class="muted">${S.points>=p.cost?'':'🔒'}</span>`}</li>`; }
  h+='</ul></div>';
  const s=$('#s-prizes'); s.innerHTML=h;
  s.querySelectorAll('[data-redeem]').forEach(b=>b.addEventListener('click',()=>{ const p=S.prizes.find(x=>x.id===b.dataset.redeem);
    modal(`<h3>${p.emoji} Hent "${esc(p.name)}"?</h3><p>Du har ${S.points} point – du har nået ${p.cost}. Vis det til en voksen!</p><button class="btn big green" id="ok">Ja, hent den! 🎁</button><button class="btn ghost big" onclick="closeModal()" style="margin-top:8px">Vent lidt</button>`);
    $('#ok').addEventListener('click',()=>{ p.redeemedAt=today(); checkBadges(); save(); closeModal(); fanfare(); confetti(260); speak('Præmie! Tillykke!'); renderPrizes(); }); }));
}

// ===== MERE / FORÆLDRE =====
function renderMore(){
  header(); const {per,bonus,n}=pointsPer();
  $('#s-more').innerHTML=`<div class="card"><div class="label">Indstillinger</div>
    <div class="toggle"><span>🔊 Lyd</span><button class="switch ${S.settings.sound?'on':''}" id="t-sound"><i></i></button></div>
    <div class="toggle"><span>🗣️ Stemme (læser øvelserne op)</span><button class="switch ${S.settings.voice?'on':''}" id="t-voice"><i></i></button></div>
    <div class="toggle"><span>☔ Regnvejr (kun indendørs øvelser)</span><button class="switch ${S.settings.rain?'on':''}" id="t-rain"><i></i></button></div></div>
  <div class="card"><div class="label">Sådan virker det</div><p class="small ink2" style="margin:0">Hver dag får du <b>${n} øvelser</b>: én <b>ny øvelse</b> 🆕 fra stigen og ${n-1} af dem, du allerede kan – dem, der er længst siden. Hver øvelse giver <b>${per} point</b>${bonus?`, og laver du alle sammen samme dag, får du <b>${bonus} point ekstra</b>`:''} – højst <b>${DAILY_MAX} point om dagen</b>. Pointene samler sig op på præmiestigen. 🔥 Streak: træn hver dag – én fridag om ugen er tilladt. Om søndagen er der <b>testdag</b>, hvor du måler, om du bliver bedre.</p></div>
  <button class="btn big navy" id="btn-parent">👨‍👩‍👦 Forældre-menu</button>
  <p class="muted center small mt">Basketbold v3 · ${DRILLS.length} øvelser · Åbn fra hjemmeskærmen for fuld skærm og offline-brug.</p>`;
  $('#t-sound').addEventListener('click',e=>{ S.settings.sound=!S.settings.sound; save(); e.currentTarget.classList.toggle('on'); beep(); });
  $('#t-voice').addEventListener('click',e=>{ S.settings.voice=!S.settings.voice; save(); e.currentTarget.classList.toggle('on'); if(S.settings.voice) speak('Hej! Nu læser jeg øvelserne op.'); else shutUp(); });
  $('#t-rain').addEventListener('click',e=>{ S.settings.rain=!S.settings.rain; save(); e.currentTarget.classList.toggle('on'); header(); });
  $('#btn-parent').addEventListener('click',()=>requirePin(parentMenu));
}
function requirePin(fn){
  if(!S.settings.pin) return fn(); let entered='';
  modal(`<h3>🔒 Forældre-PIN</h3><div class="pindots" id="dots"></div><div class="pinpad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button data-k="${k}" ${k===''?'style="visibility:hidden"':''}>${k}</button>`).join('')}</div><button class="btn ghost big" onclick="closeModal()" style="margin-top:10px">Luk</button>`);
  const upd=()=>{ $('#dots').textContent='●'.repeat(entered.length); if(entered.length===4){ if(entered===S.settings.pin){ closeModal(); fn(); } else { entered=''; sadbeep(); toast('Forkert PIN'); setTimeout(upd,300); } } };
  $('#modal-body').querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.k; if(k==='⌫') entered=entered.slice(0,-1); else if(entered.length<4) entered+=k; upd(); }));
}
function parentMenu(){
  const E=S.settings.eq;
  modal(`<h3>👨‍👩‍👦 Forældre-menu</h3>
    <div class="label">Øvelsesstigen</div><p class="small ink2" style="margin:0 0 6px">Hver træningsdag låses én ny øvelse op automatisk. Her kan I skrue frem eller tilbage.</p>
    <div class="flex"><span class="grow">Øvelser lært: <b id="unl">${S.unlocked}</b> af ${pool().length}</span><button class="btn ghost sm" data-unl="-1">−1</button><button class="btn ghost sm" data-unl="1">+1</button></div>
    <div class="flex mt"><span class="grow">Øvelser pr. dag</span><div class="sel" style="margin:0">${[8,10,12].map(k=>`<button data-daily="${k}" class="${(S.daily||10)===k?'on':''}">${k}</button>`).join('')}</div></div>
    <div class="hr"></div>
    <div class="field"><label>Barnets navn</label><input type="text" id="f-name" value="${esc(S.name)}" placeholder="fx Oscar"></div>
    <div class="field"><label>Modstander i duel</label><input type="text" id="f-opp" value="${esc(S.opponent)}"></div>
    <div class="field"><label>PIN til denne menu (4 cifre, tom = ingen)</label><input type="password" id="f-pin" inputmode="numeric" maxlength="4" value="${esc(S.settings.pin)}"></div>
    <div class="hr"></div><div class="label">Udstyr</div>
    ${[['kurv','🥅 Basketkurv'],['2bolde','🏀 To bolde'],['kegler','🚧 Kegler (eller sko)'],['tape','🟧 Tape-måtte på gulvet']].map(([k,n])=>`<div class="toggle"><span>${n}</span><button class="switch ${E[k]?'on':''}" data-eq="${k}"><i></i></button></div>`).join('')}
    <div class="hr"></div><div class="label">Præmiestigen</div><ul class="list" id="prize-list">${[...S.prizes].sort((a,b)=>a.cost-b.cost).map(p=>`<li><div class="em">${p.emoji}</div><div class="nm"><b>${esc(p.name)}${p.redeemedAt?' <span class="muted small">(hentet)</span>':''}</b><small>${p.cost} point</small></div><button class="btn ghost sm" data-del="${p.id}">Slet</button></li>`).join('')}</ul>
    <div class="flex mt"><input type="text" id="p-emoji" placeholder="🎁" style="width:64px;padding:10px;border:2px solid var(--line);border-radius:12px;text-align:center"><input type="text" id="p-name" placeholder="Præmie" class="grow" style="padding:10px;border:2px solid var(--line);border-radius:12px;min-width:0"><input type="number" id="p-cost" placeholder="point" style="width:90px;padding:10px;border:2px solid var(--line);border-radius:12px"></div>
    <div class="flex mt"><button class="btn sm" id="p-add">Tilføj præmie</button><button class="btn sm ghost" id="p-reset">Gendan standard-stigen</button></div>
    <div class="hr"></div><div class="label">Point</div>
    <div class="flex"><span class="grow">I alt: <b id="bal">${S.points}</b></span><button class="btn ghost sm" data-adj="-25">−25</button><button class="btn ghost sm" data-adj="-5">−5</button><button class="btn ghost sm" data-adj="5">+5</button><button class="btn ghost sm" data-adj="25">+25</button></div>
    <div class="hr"></div><div class="label">Backup</div>
    <p class="small ink2" style="margin:4px 0">Alt gemmes kun på denne iPad. Gem en backup en gang imellem.</p>
    <div class="flex" style="flex-wrap:wrap"><button class="btn sm navy" id="b-export">⬇️ Gem backup-fil</button><button class="btn sm ghost" id="b-copy">Kopiér som tekst</button><button class="btn sm ghost" id="b-import">⬆️ Gendan</button></div>
    <input type="file" id="b-file" accept="application/json,.json" style="display:none">
    <div class="hr"></div><button class="btn big" id="f-save">Gem</button>
    <button class="btn ghost big" id="f-reset" style="margin-top:8px;color:var(--red)">Nulstil alt</button>`);
  const b=$('#modal-body'); let newUnl=S.unlocked, newDaily=S.daily||10;
  b.querySelectorAll('[data-unl]').forEach(x=>x.addEventListener('click',()=>{ newUnl=Math.max(1,Math.min(pool().length,newUnl+Number(x.dataset.unl))); $('#unl').textContent=newUnl; }));
  b.querySelectorAll('[data-daily]').forEach(x=>x.addEventListener('click',()=>{ newDaily=Number(x.dataset.daily); b.querySelectorAll('[data-daily]').forEach(y=>y.classList.toggle('on',y===x)); }));
  b.querySelectorAll('[data-eq]').forEach(x=>x.addEventListener('click',()=>{ E[x.dataset.eq]=!E[x.dataset.eq]; x.classList.toggle('on'); }));
  b.querySelectorAll('[data-del]').forEach(x=>x.addEventListener('click',()=>{ S.prizes=S.prizes.filter(p=>p.id!==x.dataset.del); x.closest('li').remove(); }));
  b.querySelectorAll('[data-adj]').forEach(x=>x.addEventListener('click',()=>{ S.points=Math.max(0,S.points+Number(x.dataset.adj)); $('#bal').textContent=S.points; }));
  $('#p-add').addEventListener('click',()=>{ const name=$('#p-name').value.trim(), cost=Number($('#p-cost').value), emoji=$('#p-emoji').value.trim()||'🎁'; if(!name||!cost) return toast('Skriv navn og point');
    S.prizes.push({id:'p'+Date.now(),emoji,name,cost}); $('#prize-list').insertAdjacentHTML('beforeend',`<li><div class="em">${emoji}</div><div class="nm"><b>${esc(name)}</b><small>${cost} point</small></div></li>`); $('#p-name').value='';$('#p-cost').value='';$('#p-emoji').value=''; });
  $('#p-reset').addEventListener('click',()=>{ if(confirm('Erstat præmielisten med standard-stigen (50–1000 point)?')){ const got=S.prizes.filter(p=>p.redeemedAt); S.prizes=defaultPrizes().map(p=>{ const g=got.find(x=>x.cost===p.cost); return g?{...p,redeemedAt:g.redeemedAt}:p; }); save(); closeModal(); parentMenu(); } });
  $('#f-save').addEventListener('click',()=>{ const changed=newUnl!==S.unlocked||newDaily!==(S.daily||10); S.unlocked=newUnl; S.daily=newDaily; if(changed) S.plan=null; const lvUp=false; S.name=$('#f-name').value.trim(); S.opponent=$('#f-opp').value.trim()||'Far'; const pin=$('#f-pin').value.trim(); S.settings.pin=/^\d{4}$/.test(pin)?pin:'';
    const nb=checkBadges(); save(); closeModal(); toast('Gemt ✓'); header(); if(changed) show('home'); else renderMore(); });
  $('#f-reset').addEventListener('click',()=>{ if(confirm('Slet ALLE point, øvelser og præmier? Det kan ikke fortrydes (gem en backup først).')){ S=defaultState(); save(); closeModal(); header(); show('home'); } });
  $('#b-export').addEventListener('click',()=>{ const blob=new Blob([JSON.stringify(S)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`basketbold-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); });
  $('#b-copy').addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(S)); toast('Kopieret – gem teksten i en note'); }catch(e){ prompt('Kopiér teksten herfra:', JSON.stringify(S)); } });
  $('#b-import').addEventListener('click',()=>{ const txt=prompt('Indsæt backup-tekst her – eller tryk Annuller for at vælge en fil:'); if(txt) importState(txt); else $('#b-file').click(); });
  $('#b-file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>importState(r.result); r.readAsText(f); });
}
function importState(txt){ try{ const s=JSON.parse(txt); if(!s||!s.settings||!Array.isArray(s.log)) throw 0; S=migrate(s); save(); closeModal(); header(); show('home'); toast('Backup gendannet ✓'); }catch(e){ toast('Det lignede ikke en backup 😬'); } }

// ===== INIT =====
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !active && $('#s-home').classList.contains('active')) renderHome(); });
if('serviceWorker' in navigator && location.protocol!=='file:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
if(!S.name){ setTimeout(()=>{ modal(`<h3>🏀 Velkommen til Basketbold!</h3><p>Hvad hedder du?</p><div class="field"><input type="text" id="w-name" placeholder="Dit navn" autocomplete="off"></div><button class="btn big" id="w-ok">Lad os træne! 🔥</button>`);
  $('#w-ok').addEventListener('click',()=>{ S.name=$('#w-name').value.trim(); save(); closeModal(); header(); renderHome(); }); },300); }
show('home');
</script>
</body>
</html>
